<!-- CSS para el header -->
<style>
/* Header principal */
.header-sticky {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: var(--primary-color);
  color: white;
  z-index: 1020;
  padding: 0.5rem 1rem;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  height: 70px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

/* Botón menú móvil */
.btn-menu-mobile {
  background: none;
  border: none;
  color: white;
  padding: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Buscador */
.search-container {
  position: relative;
  width: 100%;
}

.buscador-header {
  width: 100%;
  height: 44px;
  padding: 0.6rem 1.2rem;
  border-radius: 24px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.12);
  color: white;
  font-size: 0.9rem;
  transition: var(--transition);
}

.buscador-header::placeholder {
  color: rgba(255, 255, 255, 0.7);
}

.buscador-header:focus {
  background: rgba(255, 255, 255, 0.2);
  box-shadow: 0 0 0 2px rgba(201, 169, 110, 0.5);
  outline: none;
  border-color: var(--premium-gold);
}

/* Sugerencias */
.sugerencias-container {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: white;
  border: 1px solid var(--gray-medium);
  border-radius: 12px;
  box-shadow: var(--shadow-premium);
  max-height: 400px;
  overflow-y: auto;
  z-index: 9999;
  margin-top: 8px;
  display: none;
}

.sugerencias-container.mostrar {
  display: block;
}

/* Menú desktop */
.header-menu-desktop {
  margin-left: auto;
  margin-right: 20px;
}

.list-menu-desktop {
  display: flex;
  list-style: none;
  margin: 0;
  padding: 0;
  gap: 25px;
}

.list-menu-desktop li {
  position: relative;
}

.list-menu-desktop a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  padding: 8px 0;
  transition: color 0.3s;
}

.list-menu-desktop a:hover {
  color: var(--premium-gold);
}

/* Submenu desktop */
.submenu-desktop {
  position: absolute;
  top: 100%;
  left: 0;
  background: white;
  border-radius: 12px;
  box-shadow: var(--shadow-premium);
  min-width: 250px;
  display: none;
  padding: 10px 0;
  z-index: 1000;
}

.menu-con-desplegable:hover .submenu-desktop {
  display: block;
}

/* Iconos del header */
.header-icons {
  display: flex;
  align-items: center;
  gap: 20px;
}

.header-icon {
  color: white;
  text-decoration: none;
  position: relative;
  display: flex;
  align-items: center;
}

.contador-carrito {
  position: absolute;
  top: -8px;
  right: -8px;
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: white;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: 700;
  border: 2px solid white;
}

/* Menú móvil completo */
.menu-mobile-container {
  position: fixed;
  top: 0;
  left: -100%;
  width: 85%;

  height: 100vh;

  z-index: 1050;
  transition: left 0.3s ease;
  overflow-y: auto;
}

.menu-mobile-container.abierto {
  left: 0;
}

.menu-mobile-header {
  background: var(--primary-color);
  color: white;
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);

.btn-close-menu {
  background: none;
  border: none;
  color: white;
  font-size: 2rem;
  cursor: pointer;
  line-height: 1;

.menu-mobile-content {
  padding: 1rem;

.menu-mobile-item {

  padding: 12px 15px;
  text-decoration: none;

.menu-mobile-item:hover {

.menu-mobile-categorias {

  border-bottom: 2px solid var(--primary-color);

/* Categorías en menú */
.categorias-menu-lista {
  display: flex;
  flex-direction: column;
}

.categoria-menu-item {
  padding: 10px 15px;
  text-decoration: none;
  color: var(--text-dark);
  border-radius: 8px;
  margin-bottom: 5px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.categoria-menu-item:hover {
  background: var(--primary-color);
  color: white;
}

/* Overlay para menú móvil */
.menu-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1049;
  display: none;
}

.menu-overlay.visible {
  display: block;
}

/* Responsive */
@media (max-width: 767px) {
  .header-sticky {
    padding: 0.5rem;
    height: 60px;
  }
  
  .logo span {
    display: none;
  }
  
  .search-desktop {
    margin: 0 10px;
  }
  
  .buscador-header {
    height: 40px;
    font-size: 0.85rem;
  }
  
  .header-menu-desktop {
    display: none !important;
  }
}

@media (min-width: 768px) {
  .btn-menu-mobile {
    display: none;
  }
  
  .menu-mobile-container {
    display: none;
  }
}
</style>

<!-- JavaScript para el header -->
<script>
// Función para mostrar/ocultar menú móvil
function toggleMenuMobile() {
  const menu = document.getElementById('menu-mobile-container');
  const overlay = document.querySelector('.menu-overlay') || crearOverlay();
  
  if (menu.classList.contains('abierto')) {
    menu.classList.remove('abierto');
    overlay.classList.remove('visible');
  } else {
    menu.classList.add('abierto');
    overlay.classList.add('visible');
  }
}

function crearOverlay() {
  const overlay = document.createElement('div');
  overlay.className = 'menu-overlay';
  overlay.onclick = toggleMenuMobile;
  document.body.appendChild(overlay);
  return overlay;
}

// Función para buscar productos (compatible con tu JS)
function buscarProductos() {
  const input = document.getElementById('buscador-header');
  const contenedor = document.getElementById('sugerencias-header');
  
  if (!input || !contenedor) return;
  
  const termino = input.value.trim().toLowerCase();
  
  if (termino.length < 2) {
    contenedor.classList.remove('mostrar');
    return;
  }
  
  if (!window.productosGlobal || !Array.isArray(window.productosGlobal)) {
    console.warn('No hay productos cargados para buscar');
    return;
  }
  
  const resultados = window.productosGlobal.filter(producto => {
    const nombre = (producto.producto || '').toLowerCase();
    const tipo = (producto.tipo || '').toLowerCase();
    const subtipo = (producto.subtipo || '').toLowerCase();
    
    return nombre.includes(termino) || 
           tipo.includes(termino) || 
           subtipo.includes(termino);
  }).slice(0, 10);
  
  if (resultados.length > 0) {
    const html = resultados.map(producto => `
      <a href="PRODUCTO.HTML?id=${producto.id}" class="sugerencia-item">
        <img src="${producto.imagen || 'https://ik.imagekit.io/mbsk9dati/placeholder-producto.jpg'}" 
             alt="${producto.producto}" 
             width="48" height="48">
        <div class="sugerencia-info">
          <div class="sugerencia-nombre">${producto.producto}</div>
          <div class="sugerencia-categoria">${producto.tipo} • ${producto.subtipo}</div>
        </div>
        <div class="sugerencia-precio">${Number(producto.precio || 0).toLocaleString('es-CO')}</div>
      </a>
    `).join('');
    
    contenedor.innerHTML = html;
    contenedor.classList.add('mostrar');
  } else {
    contenedor.innerHTML = `
      <div class="sugerencia-item text-muted">
        <div class="sugerencia-info text-center">
          No se encontraron productos
        </div>
      </div>
    `;
    contenedor.classList.add('mostrar');
  }
}

function mostrarSugerencias() {
  const input = document.getElementById('buscador-header');
  if (input && input.value.trim().length >= 2) {
    buscarProductos();
  }
}

// Cerrar sugerencias al hacer clic fuera
document.addEventListener('click', (e) => {
  const sugerencias = document.getElementById('sugerencias-header');
  const buscador = document.getElementById('buscador-header');
  
  if (sugerencias && buscador && 
      !sugerencias.contains(e.target) && 
      !buscador.contains(e.target)) {
    sugerencias.classList.remove('mostrar');
  }
});

// Cargar categorías en menú
function cargarCategoriasEnHeader() {
  if (!window.productosGlobal || !Array.isArray(window.productosGlobal)) {
    setTimeout(cargarCategoriasEnHeader, 1000);
    return;
  }
  
  const tiposUnicos = ['TODOS', ...new Set(window.productosGlobal.map(p => p.tipo).filter(Boolean))];
  
  // Menú desktop
  const menuDesktop = document.getElementById('menu-categorias-dinamico');
  if (menuDesktop) {
    const htmlDesktop = tiposUnicos.map(tipo => `
      <a href="#" class="categoria-menu-item"
         onclick="filtrarPorTipoDesdeCategoria('${tipo}'); return false;">
        <span>${window.obtenerIcono ? window.obtenerIcono(tipo, 0) : '📦'}</span>
        <span>${tipo}</span>
      </a>
    `).join('');
    
    menuDesktop.innerHTML = htmlDesktop;
  }
  
  // Menú móvil
  const menuMobile = document.getElementById('menu-categorias-mobile');
  if (menuMobile) {
    const htmlMobile = tiposUnicos.map(tipo => `
      <a href="#" class="categoria-menu-item"
         onclick="filtrarPorTipoDesdeCategoria('${tipo}'); toggleMenuMobile(); return false;">
        <span>${window.obtenerIcono ? window.obtenerIcono(tipo, 0) : '📦'}</span>
        <span>${tipo}</span>
      </a>
    `).join('');
    
    menuMobile.innerHTML = htmlMobile;
  }
}

// Función para filtrar desde categorías (compatible con tu JS)
function filtrarPorTipoDesdeCategoria(tipo) {
  if (typeof window.cargarPorTipo === 'function') {
    window.cargarPorTipo(tipo);
  } else if (typeof window.mostrarTodosLosProductos === 'function') {
    window.mostrarTodosLosProductos();
  }
  return false;
}

// Toggle carrito (compatible con tu JS)
function toggleCarrito() {
  if (typeof window.mostrarCarrito === 'function') {
    window.mostrarCarrito();
  } else {
    // Intentar abrir el offcanvas de carrito si existe
    const carritoOffcanvas = document.getElementById('carritoOffcanvas');
    if (carritoOffcanvas) {
      const bsOffcanvas = new bootstrap.Offcanvas(carritoOffcanvas);
      bsOffcanvas.show();
    }
  }
}

// Inicializar cuando se cargue la página
document.addEventListener('DOMContentLoaded', () => {
  // Cargar categorías después de que se carguen los productos
  if (window.productosGlobal && window.productosGlobal.length > 0) {
    cargarCategoriasEnHeader();
  } else {
    // Intentar cada segundo hasta que se carguen los productos
    const interval = setInterval(() => {
      if (window.productosGlobal && window.productosGlobal.length > 0) {
        cargarCategoriasEnHeader();
        clearInterval(interval);
      }
    }, 1000);
  }
  
  // Actualizar contador del carrito
  function actualizarContadorCarrito() {
    const contador = document.getElementById('contador-carrito-header');
    if (!contador) return;
    
    try {
      const carritoGuardado = localStorage.getItem('carritoAnmago');
      let totalItems = 0;
      
      if (carritoGuardado) {
        const carrito = JSON.parse(carritoGuardado);
        totalItems = carrito.reduce((sum, item) => sum + (item.cantidad || 1), 0);
      }
      
      contador.textContent = totalItems;
      contador.style.display = totalItems > 0 ? 'flex' : 'none';
    } catch (e) {
      console.error('Error actualizando contador:', e);
    }
  }
  
  // Actualizar cada segundo
  setInterval(actualizarContadorCarrito, 1000);
  actualizarContadorCarrito();
});

// Hacer funciones disponibles globalmente
window.toggleMenuMobile = toggleMenuMobile;
window.buscarProductos = buscarProductos;
window.mostrarSugerencias = mostrarSugerencias;
window.toggleCarrito = toggleCarrito;
</script>
