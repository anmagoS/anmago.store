<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dejar Reseña | Anmago Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { 
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .card-resena {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .rating-stars {
      font-size: 2.5rem;
      cursor: pointer;
      text-align: center;
      padding: 1rem 0;
    }
    .rating-stars i {
      margin: 0 8px;
      color: #ffc107;
      transition: all 0.2s ease;
    }
    .rating-stars i:hover {
      transform: scale(1.3);
      text-shadow: 0 0 10px rgba(255,193,7,0.5);
    }
    .btn-enviar {
      background: linear-gradient(135deg, #1B4557, #2A6A8F);
      border: none;
      border-radius: 50px;
      padding: 15px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .btn-enviar:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(27,69,87,0.3);
    }
    .producto-info {
      background: linear-gradient(135deg, #f8f9fa, #ffffff);
      border-left: 4px solid #1B4557;
      border-radius: 12px;
      padding: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 600px;">
    <div class="card card-resena p-4">
      
      <!-- Logo o título -->
      <div class="text-center mb-4">
        <img src="https://ik.imagekit.io/mbsk9dati/logo.jpg?tr=w-80,h-80" alt="Anmago Store" width="60" height="60" class="rounded-circle mb-2">
        <h2 class="h4 fw-bold">⭐ Deja tu opinión</h2>
        <p class="text-muted small">Tu reseña ayuda a otros clientes a decidirse</p>
      </div>
      
      <!-- Información del producto (se carga dinámicamente) -->
      <div id="info-producto" class="producto-info mb-4 text-center">
        <div class="spinner-border spinner-border-sm text-primary"></div>
        <span class="ms-2">Cargando producto...</span>
      </div>
      
      <form id="form-resena" onsubmit="enviarResena(event)">
        <input type="hidden" id="producto-id">
        <input type="hidden" id="producto-nombre">
        
        <!-- Nombre del cliente -->
        <div class="mb-4">
          <label class="form-label fw-bold">
            <i class="bi bi-person-circle me-2"></i>Tu nombre
          </label>
          <input type="text" class="form-control form-control-lg" id="nombre-cliente" 
                 placeholder="Ej: Juan Pérez" required>
        </div>
        
        <!-- Sistema de estrellas -->
        <div class="mb-4">
          <label class="form-label fw-bold d-block">
            <i class="bi bi-star-fill text-warning me-2"></i>Calificación
          </label>
          <div class="rating-stars" id="estrellas">
            <i class="bi bi-star" data-value="1"></i>
            <i class="bi bi-star" data-value="2"></i>
            <i class="bi bi-star" data-value="3"></i>
            <i class="bi bi-star" data-value="4"></i>
            <i class="bi bi-star" data-value="5"></i>
          </div>
          <input type="hidden" id="calificacion" value="0">
        </div>
        
        <!-- Comentario -->
        <div class="mb-4">
          <label class="form-label fw-bold">
            <i class="bi bi-chat-text me-2"></i>Tu opinión
          </label>
          <textarea class="form-control form-control-lg" id="comentario" rows="4" 
                    placeholder="¿Qué te pareció el producto? ¿Cómo te quedó la talla? ¿La calidad?" required></textarea>
        </div>
        
        <!-- Botón enviar -->
        <button type="submit" class="btn btn-enviar w-100 text-white">
          <i class="bi bi-send me-2"></i>Enviar Reseña
        </button>
        
        <p class="text-center text-muted small mt-3">
          <i class="bi bi-shield-check me-1"></i>
          Tu opinión será revisada antes de publicarse
        </p>
      </form>
    </div>
  </div>

  <script>
    // ==============================================
    // CONFIGURACIÓN DE TELEGRAM
    // ==============================================
    const TELEGRAM_TOKEN = '8320682242:AAG4h89_8WVmljeEvYHjzRxmnJDt-HoxcAY';
    const TELEGRAM_CHAT_ID = '-1003725648035'; // El ID de tu grupo de reseñas
    
    // ==============================================
    // TOMAR ID DE LA URL
    // ==============================================
    const urlParams = new URLSearchParams(window.location.search);
    const productoId = urlParams.get('id');
    
    if (!productoId) {
      document.getElementById('info-producto').innerHTML = `
        <div class="alert alert-danger">
          <i class="bi bi-exclamation-triangle me-2"></i>
          Error: No se especificó el producto
        </div>
      `;
      throw new Error('ID no especificado');
    }
    
    document.getElementById('producto-id').value = productoId;
    
    // ==============================================
    // BUSCAR INFORMACIÓN DEL PRODUCTO
    // ==============================================
    async function buscarProducto() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/anmagoS/anmago.store/main/catalogo.json');
        const catalogo = await response.json();
        
        // Buscar el producto por ID (puede ser parcial)
        const producto = catalogo.find(p => p.id === productoId || p.id.startsWith(productoId));
        
        if (producto) {
          document.getElementById('producto-nombre').value = producto.producto;
          document.getElementById('info-producto').innerHTML = `
            <i class="bi bi-box-seam me-2"></i>
            <strong>${producto.producto}</strong><br>
            <small class="text-muted">ID: ${productoId}</small>
          `;
        } else {
          document.getElementById('info-producto').innerHTML = `
            <i class="bi bi-box me-2"></i>
            <strong>Producto ID: ${productoId}</strong>
          `;
        }
      } catch (error) {
        document.getElementById('info-producto').innerHTML = `
          <i class="bi bi-box me-2"></i>
          <strong>Producto ID: ${productoId}</strong>
        `;
      }
    }
    
    // ==============================================
    // SISTEMA DE ESTRELLAS
    // ==============================================
    const estrellas = document.querySelectorAll('#estrellas i');
    const calificacionInput = document.getElementById('calificacion');
    
    estrellas.forEach(estrella => {
      estrella.addEventListener('click', function() {
        const valor = parseInt(this.dataset.value);
        calificacionInput.value = valor;
        
        estrellas.forEach((e, index) => {
          if (index < valor) {
            e.className = 'bi bi-star-fill text-warning';
          } else {
            e.className = 'bi bi-star';
          }
        });
      });
    });
    
    // ==============================================
    // ENVIAR RESEÑA A TELEGRAM
    // ==============================================
    async function enviarResena(event) {
      event.preventDefault();
      
      // Obtener datos
      const nombre = document.getElementById('nombre-cliente').value.trim();
      const calificacion = parseInt(document.getElementById('calificacion').value);
      const comentario = document.getElementById('comentario').value.trim();
      const productoNombre = document.getElementById('producto-nombre').value || 'Producto';
      
      // Validaciones
      if (!nombre) {
        alert('Por favor ingresa tu nombre');
        return;
      }
      
      if (calificacion === 0) {
        alert('Por favor selecciona una calificación');
        return;
      }
      
      if (!comentario) {
        alert('Por favor escribe tu opinión');
        return;
      }
      
      // Mostrar estado de carga
      const btn = document.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Enviando...';
      
      try {
        // Crear mensaje para Telegram
        const estrellasTexto = '★'.repeat(calificacion) + '☆'.repeat(5 - calificacion);
        const fecha = new Date().toLocaleString('es-CO', {
          timeZone: 'America/Bogota',
          hour12: true
        });
        
        const mensaje = `
⭐ *NUEVA RESEÑA RECIBIDA*
━━━━━━━━━━━━━━━━━━━━━
📦 *Producto:* ${productoNombre}
🆔 *ID:* ${productoId}
👤 *Cliente:* ${nombre}
📊 *Calificación:* ${estrellasTexto} (${calificacion}/5)
💬 *Comentario:* 
${comentario}

⏰ *Fecha:* ${fecha}
✅ *Pendiente de revisión*
        `;
        
        // Enviar a Telegram
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: mensaje,
            parse_mode: 'Markdown'
          })
        });
        
        const data = await response.json();
        
        if (data.ok) {
          // Mostrar mensaje de éxito
          document.getElementById('form-resena').innerHTML = `
            <div class="text-center py-5">
              <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
              </div>
              <h3 class="h4 fw-bold mb-3">¡Gracias por tu reseña!</h3>
              <p class="text-muted mb-4">Hemos recibido tu opinión y la revisaremos para publicarla.</p>
              <a href="https://anmagos.github.io/anmago.store/PRODUCTO.HTML?id=${productoId}" 
                 class="btn btn-outline-primary">
                <i class="bi bi-arrow-left me-2"></i>Volver al producto
              </a>
            </div>
          `;
        } else {
          throw new Error('Error al enviar a Telegram');
        }
        
      } catch (error) {
        console.error('Error:', error);
        alert('Hubo un error al enviar la reseña. Por favor intenta de nuevo.');
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    }
    
    // Inicializar
    buscarProducto();
  </script>
</body>
</html>
