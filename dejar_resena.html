<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dejar Reseña | Anmago Store</title>
  <!-- Mismos estilos que tu tienda -->
</head>
<body>
  <div class="container py-5" style="max-width: 600px;">
    <h2 class="text-center mb-4">⭐ Deja tu opinión sobre el producto</h2>
    
    <div class="card p-4">
      <!-- Los datos del producto se pasan por URL -->
      <div id="info-producto" class="mb-3">
        <!-- Se llena con JavaScript -->
      </div>
      
      <form id="form-resena">
        <input type="hidden" id="producto-id" name="producto-id">
        
        <div class="mb-3">
          <label class="form-label">Tu nombre</label>
          <input type="text" class="form-control" id="nombre-cliente" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label">Calificación</label>
          <div class="rating-stars fs-1">
            <i class="bi bi-star" data-value="1"></i>
            <i class="bi bi-star" data-value="2"></i>
            <i class="bi bi-star" data-value="3"></i>
            <i class="bi bi-star" data-value="4"></i>
            <i class="bi bi-star" data-value="5"></i>
          </div>
          <input type="hidden" id="calificacion" value="0">
        </div>
        
        <div class="mb-3">
          <label class="form-label">Tu opinión</label>
          <textarea class="form-control" id="comentario" rows="4" required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary w-100">Enviar Reseña</button>
      </form>
    </div>
  </div>
  
  <script>
    // Tomar datos de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const productoId = urlParams.get('id');
    const productoNombre = urlParams.get('nombre');
    
    document.getElementById('info-producto').innerHTML = `
      <h5>Producto: ${productoNombre || 'Producto'}</h5>
      <p class="text-muted">ID: ${productoId || ''}</p>
    `;
    document.getElementById('producto-id').value = productoId;
    
    // Sistema de estrellas
    document.querySelectorAll('.rating-stars i').forEach(star => {
      star.addEventListener('click', function() {
        const value = this.dataset.value;
        document.getElementById('calificacion').value = value;
        
        // Marcar estrellas
        document.querySelectorAll('.rating-stars i').forEach((s, index) => {
          if (index < value) {
            s.className = 'bi bi-star-fill text-warning';
          } else {
            s.className = 'bi bi-star';
          }
        });
      });
    });
    
    // Enviar reseña (por ahora, solo guarda localmente)
    document.getElementById('form-resena').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Aquí podrías enviar por Telegram o guardar en Sheets
      alert('¡Gracias por tu reseña! Será publicada después de verificar la compra.');
      window.close();
    });
  </script>
</body>
</html>
